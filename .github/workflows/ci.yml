name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-craft.sh
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  # Proves the critical crates' tests can actually fail. Advisory, not a gate:
  # a surviving mutant is a test to strengthen, triaged from the run's output.
  mutants:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants -p tern-vault -p tern-sync --no-shuffle
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
  # A gate on pull requests: every changed line in the critical crates has a test that fails
  # when that line breaks. The full run above stays advisory.
  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - run: git diff "origin/${{ github.base_ref }}...HEAD" -- crates/tern-vault crates/tern-sync > pr.diff
      - run: test ! -s pr.diff || cargo mutants -p tern-vault -p tern-sync --in-diff pr.diff
  # The release path, unsigned: bundle, zip, dmg and a cask that passes brew style. It broke
  # silently once (dmgbuild needing a newer Python) because only a release ran it.
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: Swatinem/rust-cache@v2
      - run: scripts/release.sh
      - run: ls target/release/bundle/tern-*-macos-arm64.zip target/release/bundle/tern-*-macos-arm64.dmg target/release/bundle/tern.rb
