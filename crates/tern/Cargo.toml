[package]
name = "tern"
description = "A fast, low-memory SSH terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# The update check reads this (CARGO_PKG_REPOSITORY) to find releases; without it there is none.
repository.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.8" }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
tern-ssh.workspace = true
tern-term.workspace = true
tern-sync.workspace = true
tern-vault.workspace = true
base64 = "0.23"
chrono.workspace = true
ureq.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry"] }
strip-ansi-escapes = "0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
# libmalloc keeps a freed 256 MiB scrypt block resident; mimalloc hands it back to the OS.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSView", "NSResponder", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
raw-window-handle = { version = "0.6", default-features = false }
# The sleep and screen-lock notifications (lock_on_sleep.rs). Already in Cargo.lock through gpui.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSOperation", "NSDistributedNotificationCenter"] }

[features]
# Compiles the TERN_DEV_KEYS replay (devkeys.rs) into a release build. Off by default and never
# in a shipped bundle: scripts/measure-memory.sh builds one copy with it to open a throwaway vault.
dev-keys = []

[dev-dependencies]
tempfile = "3"
# Layout and scroll tests drive a real gpui window through its test platform.
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
# Session scenario tests log in to an in-process SSH server; the versions tern-ssh already uses.
russh = "0.64"
rand = { version = "0.10", features = ["thread_rng"] }
tokio = { version = "1", features = ["net", "macros"] }

[lints]
workspace = true

# Off macOS the vault passphrase lives in the platform credential store through `keyring`:
# Windows Credential Manager, or the Secret Service (GNOME Keyring, KWallet) on Linux.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# gpui_platform turns both Linux backends off by default; without one `application()` panics.
[target.'cfg(target_os = "linux")'.dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "=0.3.8"
features = ["wayland", "x11"]
